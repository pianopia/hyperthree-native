[package]
name = "hyperthree-native"
version = "0.1.0"
edition = "2021"
description = "Native host prototype for the HyperThree architecture"
license = "MIT"

[dependencies]
anyhow = "1.0"
boa_engine = "0.21"
bytemuck = { version = "1.16", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
gltf = "1.4"
log = "0.4"
memmap2 = "0.9"
pollster = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
wgpu = "0.20"
winit = "0.29"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
