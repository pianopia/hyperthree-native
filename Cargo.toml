[package]
name = "hyperthree-native"
version = "0.1.0"
edition = "2021"
description = "Native host prototype for the HyperThree architecture"
license = "MIT"

[dependencies]
anyhow = "1.0"
basisu = "0.1.0"
boa_engine = "0.21"
bytemuck = { version = "1.16", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
draco-oxide-core = "0.1.0-alpha.9"
draco-oxide-decoder = "0.1.0-alpha.9"
env_logger = "0.11"
gltf = { version = "1.4", features = ["extensions"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log = "0.4"
memmap2 = "0.9"
meshopt-rs = { version = "0.1.2", features = ["experimental"] }
pollster = "0.3"
rodio = { version = "0.19", default-features = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
wgpu = "0.20"
winit = "0.29"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
